        <div class="container">
            <ul id="nav-icon-list" class="nav navbar-nav">

                {% capture navbuttons %}
                {% for tab in tabs %}
                    <li class="nav-item navtab-{{ tab.short }}" data-name="{{tab.short}}">
                        <!-- <a href="{{tab.url}}"> -->
                        <a href="{{site.baseurl | append: '/' | append: tab.short}}">
                        <!-- <span class="glyphicon glyphicon-{{ tab.glyph }}"></span> -->
                        <i class="fa-solid fa-{{ tab.glyph }}"></i>
                        <span class="text-capitalize"> {{ tab.short }} </span>
                    </a></li>
                {% endfor %}
                {% endcapture %}
                {{ navbuttons }}
